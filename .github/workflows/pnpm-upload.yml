name: Create pnpm
on: 
  workflow_dispatch:
    inputs:
      tags:
        description: 'tags to create build'
jobs:
  build:
    runs-on: windows-latest
    permissions: write-all
    steps:
    - uses: actions/checkout@v4
      with:
        ref: next
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: "9.15.4"
    - name: pnpm install
      run: |
        del pnpm-lock.yaml
        pnpm install
    - name: Archive Release source
      shell: bash
      run: |
         "/c/Program Files/7-Zip/7z.exe" a -t7z -mx -m0=LZMA2 -v40m t0.7z "." -xr!node_modules -xr!.git
    - name: create release and upload assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          t0.7z
        tag_name: ${{ github.event.inputs.tags }}
